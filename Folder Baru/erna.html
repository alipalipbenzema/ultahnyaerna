<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Erna ❤️</title>
    <style>
        /* RESET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            background-attachment: fixed;
            min-height: 100vh;
            position: relative;
        }

        /* BACKGROUND ANIMATIONS */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(255,182,193,0.25) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255,105,180,0.25) 0%, transparent 50%);
            animation: floatBg 20s ease-in-out infinite;
            z-index: -2;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #fff, transparent),
                radial-gradient(2px 2px at 40px 70px, #fff, transparent);
            background-repeat: repeat;
            background-size: 200px 100px;
            animation: sparkle 3s linear infinite;
            z-index: -1;
            pointer-events: none;
        }

        @keyframes floatBg { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        @keyframes sparkle { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-100px); opacity: 0; } }

        /* HEADER */
        .header {
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding: 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            background: linear-gradient(45deg, #ff6b9d, #c44569, #ff9ff3);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: clamp(1.8rem, 6vw, 3rem);
            margin-bottom: 15px;
            animation: gradientShift 3s ease infinite;
            text-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .back-btn {
            display: inline-block;
            padding: 12px 25px;
            background: rgba(255,255,255,0.2);
            color: white;
            text-decoration: none;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            font-weight: 600;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        /* DESKTOP: HORIZONTAL SLIDE */
        @media (min-width: 769px) {
            body {
                overflow-x: auto;
                overflow-y: hidden;
            }
            
            .gallery-container {
                max-width: 100%;
                padding: 40px 20px;
                overflow-x: auto;
                overflow-y: hidden;
                scroll-snap-type: x proximity;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
                -ms-overflow-style: none;
            }

            .gallery-container::-webkit-scrollbar { display: none; }

            .gallery-grid {
                display: flex;
                gap: 30px;
                width: max-content;
                padding-bottom: 30px;
            }

            .gallery-item {
                flex: 0 0 420px;
                height: 520px;
                border-radius: 25px;
                overflow: hidden;
                box-shadow: 0 25px 50px rgba(0,0,0,0.25);
                transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
                scroll-snap-align: start;
                cursor: grab;
            }

            .gallery-item:hover {
                transform: translateY(-20px) scale(1.03);
                box-shadow: 0 50px 100px rgba(0,0,0,0.4);
                z-index: 10;
            }
        }

        /* MOBILE: VERTICAL GRID */
        @media (max-width: 768px) {
            body {
                overflow-x: hidden;
                overflow-y: auto;
            }
            
            .gallery-container {
                max-width: 100%;
                padding: 20px 15px;
                overflow: visible;
            }

            .gallery-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
                gap: 20px;
                max-width: 100%;
                margin: 0 auto;
            }

            .gallery-item {
                width: 100%;
                height: 350px;
                border-radius: 20px;
                overflow: hidden;
                box-shadow: 0 20px 40px rgba(0,0,0,0.25);
                transition: all 0.4s ease;
            }

            .gallery-item:hover {
                transform: translateY(-10px) scale(1.02);
                box-shadow: 0 30px 60px rgba(0,0,0,0.35);
            }

            /* Single column di mobile kecil */
            @media (max-width: 480px) {
                .gallery-grid {
                    grid-template-columns: 1fr;
                    gap: 25px;
                }
                
                .gallery-item {
                    height: 320px;
                }
            }
        }

        /* COMMON STYLES */
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            color: white;
            padding: 30px 25px 25px;
            transform: translateY(100%);
            transition: all 0.4s ease;
            font-size: 1.1rem;
            font-weight: 600;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .gallery-item:hover .overlay {
            transform: translateY(0);
        }

        /* CANVAS */
        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -3;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <!-- CANVAS -->
    <canvas id="canvas"></canvas>
    
    <!-- HEADER -->
    <header class="header">
        <h1>Gallery Erna 💕</h1>
        <a href="index.html" class="back-btn">← Kembali</a>
    </header>
    
    <!-- GALLERY -->
    <main class="gallery-container">
        <div class="gallery-grid">
            <div class="gallery-item">
                <img src="erna.jpg" alt="Erna 1" loading="lazy">
                <div class="overlay">💖 budak kecik ini udahh besarr</div>
            </div>
            <div class="gallery-item">
                <img src="foto.jpg" alt="Erna 2" loading="lazy">
                <div class="overlay">✨ Selalu tersenyum</div>
            </div>
            <div class="gallery-item">
                <img src="2.jpg" alt="Erna 3" loading="lazy">
                <div class="overlay">💕 thanks for being happy every day</div>
            </div>
            <div class="gallery-item">
                <img src="3.jpg" alt="Erna 4" loading="lazy">
                <div class="overlay">🌸 Happy Birthday!</div>
            </div>
            <div class="gallery-item">
                <img src="4.jpg" alt="Erna 5" loading="lazy">
                <div class="overlay">🌟 Paling manis!</div>
            </div>
            <div class="gallery-item">
                <img src="5.jpg" alt="Erna 6" loading="lazy">
                <div class="overlay">gorgoeus girl</div>
            </div>
        </div>
    </main>

    <script>
        // RESPONSIVE CANVAS
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // RAIN EFFECT
        const raindrops = [];
        for(let i = 0; i < 80; i++) {
            raindrops.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                length: Math.random() * 15 + 10,
                speed: Math.random() * 4 + 1,
                opacity: Math.random() * 0.4 + 0.2
            });
        }

        function animateRain() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            raindrops.forEach(drop => {
                ctx.strokeStyle = `rgba(255,255,255,${drop.opacity})`;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(drop.x, drop.y);
                ctx.lineTo(drop.x - 3, drop.y + drop.length);
                ctx.stroke();
                drop.y += drop.speed;
                if(drop.y > canvas.height) drop.y = -20;
            });
            requestAnimationFrame(animateRain);
        }
        animateRain();
    </script>
</body>
</html
